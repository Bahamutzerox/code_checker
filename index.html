<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Code</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00E5CC">
  <style>
    :root {
      --bg: #0C0C14; --bg2: #121220; --bg3: #1A1A2E;
      --border: #2A2A48; --text: #D8D8FF; --text2: #8888BB; --accent: #00E5CC;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 32px 16px;
    }
    header { text-align: center; margin-bottom: 40px; }
    header h1 { font-size: 22px; font-weight: 700; letter-spacing: 0.03em; }
    header p { font-size: 13px; color: var(--text2); margin-top: 6px; }
    .cards { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 420px; }
    .card {
      display: block;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px 22px;
      text-decoration: none;
      color: inherit;
      transition: box-shadow 0.15s, border-color 0.15s;
    }
    .card:hover { border-color: var(--accent); box-shadow: 0 2px 10px rgba(150,126,118,0.15); }
    .card-title { font-size: 15px; font-weight: 600; margin-bottom: 5px; }
    .card-desc { font-size: 12px; color: var(--text2); line-height: 1.6; }
    .card-tag {
      display: inline-block;
      font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
      background: var(--bg3); color: var(--accent);
      border-radius: 4px; padding: 2px 7px;
      margin-bottom: 8px;
    }
    footer { margin-top: 36px; font-size: 11px; color: var(--text2); text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>Open Code</h1>
    <p>植物命名法規開放工具 · Madrid Code 2024</p>
  </header>

  <div class="cards">
    <a class="card" href="name_checker.html">
      <div class="card-tag">表單工具</div>
      <div class="card-title">學名狀態檢核</div>
      <div class="card-desc">填入學名的發表資訊，逐層確認有效出版、有效發表、合法性與正確名稱，並提供不符合時的補救途徑。支援 IPNI 串接自動填入。</div>
    </a>
    <a class="card" href="madrid_graph.html">
      <div class="card-tag">關聯圖</div>
      <div class="card-title">馬德里法規條文關聯圖</div>
      <div class="card-desc">互動式節點圖，呈現馬德里法規各條文之間的引用與關聯關係，可搜尋條文並探索相關條目。</div>
    </a>
  </div>

  <footer>
    法規條文依據 <a href="https://www.iapt-taxon.org/nomen/main.php" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:none;">International Code of Nomenclature for algae, fungi, and plants (Madrid Code, 2024)</a>，
    由 IAPT 依 <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:none;">CC BY 4.0</a> 授權。
  </footer>
</body>
</html>
